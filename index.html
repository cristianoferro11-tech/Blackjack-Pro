<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackjack Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1d13; color: #ffffff; padding: 6px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        h1 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1.5px; color: #d4af37; margin-bottom: 6px; text-align: center; }

        /* Container Generale Tavolo + Postazioni */
        .table-wrapper {
            width: 100%;
            max-width: 500px;
            position: relative;
            margin-bottom: 12px;
            padding-bottom: 25px; /* Spazio per far uscire le sedie sotto il bordo */
        }

        /* Sfondo Tavolo Verde con Curvatura Reale */
        .felt-table { 
            width: 100%; 
            height: 180px;
            background: radial-gradient(circle, #2d6a4f 0%, #1b4332 70%, #081c15 100%); 
            border: 4px solid #d4af37; 
            border-radius: 20px 20px 180px 180px; 
            padding: 10px 6px 14px 6px; 
            box-shadow: inset 0 0 25px rgba(0,0,0,0.85), 0 8px 20px rgba(0,0,0,0.7); 
            position: relative;
        }

        /* Area Dealer (Sultavolo) */
        .dealer-area { text-align: center; margin-top: 4px; }
        .dealer-title-badge {
            font-size: 0.85rem;
            font-weight: 900;
            color: #000;
            background: #d4af37;
            padding: 2px 10px;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 4px;
            box-shadow: 0 0 8px rgba(212,175,55,0.5);
            text-transform: uppercase;
        }
        .dealer-card-slot { display: inline-flex; justify-content: center; gap: 3px; min-width: 70px; min-height: 42px; background: rgba(0,0,0,0.5); border: 2px dashed #d4af37; border-radius: 6px; padding: 3px; align-items: center; cursor: pointer; }

        /* Postazioni Fuori dal Tavolo ad Arco */
        .seats-container { 
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 120px;
            display: flex; 
            flex-direction: row-reverse; 
            justify-content: space-between; 
            align-items: flex-end; 
            padding: 0 6px; 
            pointer-events: none; /* Rende la zona passante tranne le sedie */
        }

        .seat { 
            pointer-events: auto;
            width: 58px; 
            background: rgba(15, 23, 18, 0.95); 
            border: 1px solid rgba(212,175,55,0.4); 
            border-radius: 8px; 
            padding: 4px 2px; 
            text-align: center; 
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            opacity: 0.6;
            position: relative;
            transform-origin: bottom center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.7);
        }

        /* Orientamento e Posizionamento Esterno al Semicerchio */
        #seat7 { transform: translateY(-40px) rotate(22deg); }
        #seat6 { transform: translateY(-18px) rotate(14deg); }
        #seat5 { transform: translateY(-4px) rotate(6deg); }
        #seat4 { transform: translateY(8px) rotate(0deg); } /* Postazione centrale fuori bordi */
        #seat3 { transform: translateY(-4px) rotate(-6deg); }
        #seat2 { transform: translateY(-18px) rotate(-14deg); }
        #seat1 { transform: translateY(-40px) rotate(-22deg); }

        .seat.active-player { opacity: 1; border-color: #d4af37; }
        .seat.target-turn { border: 2px solid #38b000 !important; background: rgba(20, 60, 25, 0.95) !important; opacity: 1; transform: scale(1.1) !important; z-index: 5; box-shadow: 0 0 12px #38b000; }
        .seat.user-seat { border: 2px solid #d4af37; background: rgba(40, 35, 15, 0.95); opacity: 1; width: 70px; }

        .seat-title { font-size: 0.58rem; color: #d4af37; font-weight: bold; margin-bottom: 2px; text-transform: uppercase; white-space: nowrap; }
        .seat-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 26px; }
        .seat-score { font-size: 0.62rem; font-weight: 900; color: #74c69d; margin-top: 2px; }

        /* Animazioni Carte & Tag */
        .card-tag { 
            background: #ffffff; color: #000; font-weight: 900; padding: 1px 3px; border-radius: 3px; font-size: 0.72rem; border: 1px solid #000; line-height: 1.1; display: inline-block;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Container Multi-Split */
        .split-container { display: flex; flex-direction: row-reverse; gap: 2px; justify-content: center; width: 100%; flex-wrap: nowrap; overflow-x: auto; }
        .split-hand { 
            border: 1px dashed #d4af37; border-radius: 4px; padding: 2px 1px; min-width: 20px; min-height: 26px; background: rgba(0,0,0,0.4);
            transition: all 0.25s ease; text-align: center; display: flex; flex-direction: column; align-items: center; flex: 1;
        }
        .split-hand-label { font-size: 0.42rem; color: #aaa; text-transform: uppercase; margin-bottom: 1px; font-weight: bold; }
        .split-score { font-size: 0.55rem; font-weight: 900; color: #74c69d; margin-top: 2px; white-space: nowrap; }
        .split-hand.active-subhand { border: 2px solid #38b000; background: rgba(56,176,0,0.25); transform: scale(1.02); }

        /* Badge Raddoppio Animato */
        .double-badge {
            position: absolute; top: -10px; right: -6px; background: #d4af37; color: #000; font-size: 0.58rem; font-weight: 900;
            padding: 2px 4px; border-radius: 10px; border: 1px solid #fff; box-shadow: 0 0 8px #d4af37;
            animation: doubleBounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 10;
        }

        @keyframes doubleBounce {
            0% { transform: scale(0) rotate(-15deg); }
            50% { transform: scale(1.3) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* Turn Tracker */
        .turn-tracker { width: 100%; max-width: 500px; background: #111; border: 1px solid #38b000; color: #38b000; font-weight: bold; font-size: 0.75rem; text-align: center; padding: 4px; border-radius: 6px; margin-bottom: 6px; text-transform: uppercase; }

        /* Top Config */
        .top-config { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 500px; background: rgba(0,0,0,0.7); border: 1px solid #d4af37; border-radius: 6px; padding: 4px 8px; margin-bottom: 6px; font-size: 0.72rem; }
        .bankroll-input { width: 65px; background: #222; border: 1px solid #d4af37; color: #fff; font-weight: bold; padding: 2px 4px; border-radius: 4px; text-align: center; }

        /* Controlli Raddoppio e Split */
        .special-actions-row { display: flex; justify-content: space-around; width: 100%; max-width: 500px; background: rgba(0,0,0,0.8); border: 1px solid #d4af37; border-radius: 6px; padding: 4px; margin-bottom: 6px; gap: 6px; }
        .opt-btn { flex: 1; padding: 6px; font-size: 0.72rem; font-weight: bold; border-radius: 4px; border: 1px solid #777; background: #222; color: #fff; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
        .opt-btn.active { background: #d4af37; color: #000; border-color: #fff; font-weight: 900; box-shadow: 0 0 8px rgba(212,175,55,0.6); }

        /* Decision Box */
        .decision-box { width: 100%; max-width: 500px; background: #000000; border: 2px solid #d4af37; border-radius: 8px; padding: 5px; text-align: center; margin-bottom: 6px; }
        .decision-title { font-size: 0.6rem; text-transform: uppercase; color: #aaa; }
        .decision-text { font-size: 1.15rem; font-weight: 900; color: #74c69d; }
        .deviation-note { font-size: 0.65rem; color: #d4af37; font-weight: bold; }
        .outcome-text { font-size: 0.9rem; font-weight: 900; margin-top: 2px; }

        /* Area Chip */
        .chips-section { width: 100%; max-width: 500px; background: rgba(0,0,0,0.8); border: 1px solid #d4af37; border-radius: 8px; padding: 5px; margin-bottom: 6px; text-align: center; }
        .chips-title { font-size: 0.65rem; color: #aaa; text-transform: uppercase; margin-bottom: 3px; }
        .chips-row { display: flex; justify-content: space-around; align-items: center; gap: 4px; }
        
        .chip {
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 0.8rem; color: white; border: 3px dashed #ffffff; box-shadow: 0 3px 6px rgba(0,0,0,0.6);
            cursor: pointer; user-select: none; transition: transform 0.1s;
        }
        .chip:active { transform: scale(0.9); }
        .chip-5 { background: radial-gradient(circle, #e63946, #9e2a2b); }
        .chip-10 { background: radial-gradient(circle, #1d3557, #457b9d); }
        .chip-25 { background: radial-gradient(circle, #2a9d8f, #116a5d); }
        .chip-50 { background: radial-gradient(circle, #e07a5f, #a03c28); }
        .chip-100 { background: radial-gradient(circle, #2b2b2b, #000000); border-color: #d4af37; color: #d4af37; }
        .chip-reset { background: #333; border: 1px solid #777; width: 34px; height: 34px; font-size: 0.65rem; color: #fff; border-radius: 50%; cursor: pointer; }

        /* Stats Row */
        .stats-row { display: flex; justify-content: space-between; width: 100%; max-width: 500px; font-size: 0.7rem; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 6px; margin-bottom: 6px; }
        .stat-val { color: #d4af37; font-weight: bold; }
        .profit-pos { color: #52b788; font-weight: bold; }
        .profit-neg { color: #e63946; font-weight: bold; }

        /* Tastierino */
        .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; max-width: 500px; margin-bottom: 6px; }
        .key-btn { background: #343a40; border: 1px solid #6c757d; color: white; font-size: 1.1rem; font-weight: 900; padding: 8px 0; border-radius: 6px; cursor: pointer; text-align: center; }
        .key-btn:active { background: #d4af37; color: black; }
        .key-btn.asso { background: #d4af37; color: black; }

        /* Bottoni Azioni */
        .actions-row { display: flex; gap: 4px; width: 100%; max-width: 500px; margin-top: auto; }
        .act-btn { flex: 1; padding: 9px 2px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; font-size: 0.72rem; text-transform: uppercase; }
        .btn-stand { background: #38b000; color: white; font-size: 0.8rem; font-weight: 900; }
        .btn-undo { background: #f77f00; color: white; }
        .btn-next { background: #457b9d; color: white; }
        .btn-reset { background: #e63946; color: white; }
    </style>
</head>
<body>

    <h1>Blackjack Pro</h1>

    <div class="top-config">
        <div><span>Punta con Fiches e inserisci carte</span></div>
        <div>
            <span>Bankroll:</span>
            <input type="number" id="initBankrollInput" class="bankroll-input" value="500" step="50" onchange="setInitialBankroll(this.value)">€
        </div>
    </div>

    <div class="table-wrapper">
        <div class="felt-table">
            <div class="dealer-area">
                <div class="dealer-title-badge" id="dealerTitle">Mazziere (0)</div><br>
                <div id="dealerSlot" class="dealer-card-slot" onclick="selectTargetManual('DEALER')"></div>
            </div>
        </div>

        <div class="seats-container">
            <div id="seat1" class="seat" onclick="toggleSeatActive('SEAT1')">
                <div class="seat-title" id="st1">P1</div>
                <div class="seat-cards" id="sc1"></div>
                <div class="seat-score" id="score1"></div>
            </div>
            <div id="seat2" class="seat" onclick="toggleSeatActive('SEAT2')">
                <div class="seat-title" id="st2">P2</div>
                <div class="seat-cards" id="sc2"></div>
                <div class="seat-score" id="score2"></div>
            </div>
            <div id="seat3" class="seat" onclick="toggleSeatActive('SEAT3')">
                <div class="seat-title" id="st3">P3</div>
                <div class="seat-cards" id="sc3"></div>
                <div class="seat-score" id="score3"></div>
            </div>
            <div id="seat4" class="seat user-seat active-player" onclick="toggleSeatActive('SEAT4')">
                <div id="doubleBadge" class="double-badge" style="display: none;">2X DOUBLE</div>
                <div class="seat-title" id="st4">IO (P4)</div>
                <div class="seat-cards" id="sc4"></div>
                <div class="seat-score" id="score4"></div>
            </div>
            <div id="seat5" class="seat" onclick="toggleSeatActive('SEAT5')">
                <div class="seat-title" id="st5">P5</div>
                <div class="seat-cards" id="sc5"></div>
                <div class="seat-score" id="score5"></div>
            </div>
            <div id="seat6" class="seat" onclick="toggleSeatActive('SEAT6')">
                <div class="seat-title" id="st6">P6</div>
                <div class="seat-cards" id="sc6"></div>
                <div class="seat-score" id="score6"></div>
            </div>
            <div id="seat7" class="seat" onclick="toggleSeatActive('SEAT7')">
                <div class="seat-title" id="st7">P7</div>
                <div class="seat-cards" id="sc7"></div>
                <div class="seat-score" id="score7"></div>
            </div>
        </div>
    </div>

    <div id="turnTracker" class="turn-tracker">PROSSIMA CARTA PER: P1</div>

    <div class="special-actions-row">
        <button id="btnSplit" class="opt-btn" onclick="toggleSplit()">✂️ Split Mano</button>
        <button id="btnDouble" class="opt-btn" onclick="toggleDouble()">2x Raddoppio</button>
    </div>

    <div class="chips-section">
        <div class="chips-title">Puntata Base: <strong id="currentBetDisplay" style="color:#74c69d; font-size:0.85rem;">0€</strong> <span id="recommendedBetDisplay" style="color:#d4af37; font-size:0.68rem; margin-left:6px;">(Consigliati: 5€)</span></div>
        <div class="chips-row">
            <div class="chip chip-5" onclick="addChip(5)">5</div>
            <div class="chip chip-10" onclick="addChip(10)">10</div>
            <div class="chip chip-25" onclick="addChip(25)">25</div>
            <div class="chip chip-50" onclick="addChip(50)">50</div>
            <div class="chip chip-100" onclick="addChip(100)">100</div>
            <button class="chip-reset" onclick="resetChips()">CLR</button>
        </div>
    </div>

    <div class="decision-box">
        <div class="decision-title" id="decisionHeader">Consiglio Per La Tua Mano</div>
        <div id="decisionOutput" class="decision-text">INSERISCI CARTE</div>
        <div id="deviationNote" class="deviation-note"></div>
        <div id="outcomeDisplay" class="outcome-text"></div>
    </div>

    <div class="stats-row">
        <div>TC: <span id="tcVal" class="stat-val">0.0</span></div>
        <div>Profitto: <span id="profitVal" class="profit-pos">0€</span></div>
        <div>Bankroll: <span id="bankrollVal" class="stat-val">500€</span></div>
    </div>

    <div class="keypad">
        <button class="key-btn" onclick="inputCard('2')">2</button>
        <button class="key-btn" onclick="inputCard('3')">3</button>
        <button class="key-btn" onclick="inputCard('4')">4</button>
        <button class="key-btn" onclick="inputCard('5')">5</button>
        <button class="key-btn" onclick="inputCard('6')">6</button>
        <button class="key-btn" onclick="inputCard('7')">7</button>
        <button class="key-btn" onclick="inputCard('8')">8</button>
        <button class="key-btn" onclick="inputCard('9')">9</button>
        <button class="key-btn" onclick="inputCard('10')">10</button>
        <button class="key-btn asso" onclick="inputCard('A')">A</button>
    </div>

    <div class="actions-row">
        <button class="act-btn btn-stand" onclick="playerStands()">✋ STAI (PASSA)</button>
        <button class="act-btn btn-undo" onclick="undoLastCard()">↩ Annulla</button>
        <button class="act-btn btn-next" onclick="nextHand()">Nuova Mano</button>
        <button class="act-btn btn-reset" onclick="resetAll()">Reset Mazzo</button>
    </div>

    <script>
        let dealerCards = [];
        let seatsCards = { SEAT1: [], SEAT2: [], SEAT3: [], SEAT4: [], SEAT5: [], SEAT6: [], SEAT7: [] };
        
        function createInitialSplitState() {
            return {
                active: false,
                hands: [],
                currentIndex: 0
            };
        }

        let splitStates = {
            SEAT1: createInitialSplitState(),
            SEAT2: createInitialSplitState(),
            SEAT3: createInitialSplitState(),
            SEAT4: createInitialSplitState(),
            SEAT5: createInitialSplitState(),
            SEAT6: createInitialSplitState(),
            SEAT7: createInitialSplitState()
        };

        let activeSeats = { SEAT1: false, SEAT2: false, SEAT3: false, SEAT4: true, SEAT5: false, SEAT6: false, SEAT7: false };
        let userSeatKey = 'SEAT4';

        let targetQueue = [];
        let currentQueueIndex = 0;
        let manualTargetOverride = null;

        let isInitialDealComplete = false;
        let activePlayerOrder = [];
        let currentPlayerTurnIndex = 0;

        let isDoubleActive = false;
        let inputHistory = [];

        let runningCount = 0;
        let totalCardsSeen = 0;
        const totalDecks = 6;
        let currentTrueCount = 0;

        let initialBankroll = 500;
        let currentBankroll = 500;
        let netProfit = 0;
        let userBet = 0; 
        let handResolved = false;

        function addChip(amount) {
            userBet += amount;
            updateChipsDisplay();
        }

        function resetChips() {
            userBet = 0;
            updateChipsDisplay();
        }

        function updateChipsDisplay() {
            let userSplit = splitStates[userSeatKey].active;
            let numHands = userSplit ? splitStates[userSeatKey].hands.length : 1;
            let totalRisk = userBet * (isDoubleActive ? 2 : 1) * numHands;
            document.getElementById('currentBetDisplay').innerText = `${userBet}€ ${totalRisk !== userBet ? '(Totale a Rischio: ' + totalRisk + '€)' : ''}`;
        }

        function toggleSeatActive(seatKey) {
            if (seatKey === userSeatKey) return; 
            activeSeats[seatKey] = !activeSeats[seatKey];
            buildDistributionQueue();
            updateUI();
        }

        function toggleSplit() {
            let currentTarget = getActiveTarget();
            if (currentTarget === 'DEALER') return;

            let st = splitStates[currentTarget];

            if (!st.active) {
                let cards = seatsCards[currentTarget];
                if (cards.length < 2) {
                    alert(`Servono almeno 2 carte per dividere la mano di ${currentTarget === userSeatKey ? 'IO' : currentTarget}!`);
                    return;
                }
                st.active = true;
                st.hands = [
                    { id: 'A', cards: [cards[0]] },
                    { id: 'B', cards: [cards[1]] }
                ];
                st.currentIndex = 0;
                seatsCards[currentTarget] = [];
            } else {
                let activeHand = st.hands[st.currentIndex];
                if (!activeHand || activeHand.cards.length < 2) {
                    alert("Servono almeno 2 carte nella sotto-mano corrente per poter eseguire un altro split!");
                    return;
                }
                
                let oldId = activeHand.id;
                let c1 = activeHand.cards[0];
                let c2 = activeHand.cards[1];

                let newHand1 = { id: `${oldId}1`, cards: [c1] };
                let newHand2 = { id: `${oldId}2`, cards: [c2] };

                st.hands.splice(st.currentIndex, 1, newHand1, newHand2);
            }
            
            updateChipsDisplay();
            updateUI();
        }

        function toggleDouble() {
            isDoubleActive = !isDoubleActive;
            const doubleBadge = document.getElementById('doubleBadge');
            
            if (isDoubleActive) {
                doubleBadge.style.display = 'block';
                document.getElementById('btnDouble').classList.add('active');
            } else {
                doubleBadge.style.display = 'none';
                document.getElementById('btnDouble').classList.remove('active');
            }
            updateChipsDisplay();
        }

        function buildDistributionQueue() {
            targetQueue = [];
            activePlayerOrder = [];
            let order = ['SEAT1', 'SEAT2', 'SEAT3', 'SEAT4', 'SEAT5', 'SEAT6', 'SEAT7'];
            
            order.forEach(s => { if (activeSeats[s]) activePlayerOrder.push(s); });

            activePlayerOrder.forEach(s => targetQueue.push(s));
            targetQueue.push('DEALER');
            activePlayerOrder.forEach(s => targetQueue.push(s));

            currentPlayerTurnIndex = 0;
            isInitialDealComplete = false;
        }

        function getActiveTarget() {
            if (manualTargetOverride) return manualTargetOverride;
            
            if (currentQueueIndex < targetQueue.length) {
                return targetQueue[currentQueueIndex];
            }

            if (!isInitialDealComplete) {
                isInitialDealComplete = true;
                currentPlayerTurnIndex = 0;
            }

            if (currentPlayerTurnIndex < activePlayerOrder.length) {
                return activePlayerOrder[currentPlayerTurnIndex];
            }

            return 'DEALER';
        }

        function playerStands() {
            if (manualTargetOverride) {
                manualTargetOverride = null;
            } else if (currentQueueIndex >= targetQueue.length && currentPlayerTurnIndex < activePlayerOrder.length) {
                let currentTarget = activePlayerOrder[currentPlayerTurnIndex];
                let st = splitStates[currentTarget];
                
                if (st.active && st.currentIndex < st.hands.length - 1) {
                    st.currentIndex++;
                } else {
                    currentPlayerTurnIndex++;
                }
            }
            checkAutoResolve();
            updateUI();
        }

        function selectTargetManual(key) {
            manualTargetOverride = key;
            updateUI();
        }

        function inputCard(val) {
            let target = getActiveTarget();
            let st = target !== 'DEALER' ? splitStates[target] : null;
            let handIdxState = (st && st.active) ? st.currentIndex : -1;

            addCardToTarget(target, val);
            inputHistory.push({ target: target, card: val, queueIdx: currentQueueIndex, playerIdx: currentPlayerTurnIndex, handIndex: handIdxState });

            if (!manualTargetOverride && currentQueueIndex < targetQueue.length) {
                currentQueueIndex++;
            }

            if (target !== 'DEALER' && currentQueueIndex >= targetQueue.length) {
                let currentHandArr = st.active ? st.hands[st.currentIndex].cards : seatsCards[target];
                let res = calculateHandTotal(currentHandArr);
                
                if (res.highTotal >= 21 || (res.lowTotal >= 21)) {
                    if (st.active && st.currentIndex < st.hands.length - 1) {
                        st.currentIndex++;
                    } else {
                        currentPlayerTurnIndex++;
                    }
                }
            }

            checkAutoResolve();
            updateUI();
        }

        function addCardToTarget(targetKey, cardVal) {
            updateCount(cardVal, 1);
            if (targetKey === 'DEALER') {
                dealerCards.push(cardVal);
            } else {
                let st = splitStates[targetKey];
                if (st.active) {
                    st.hands[st.currentIndex].cards.push(cardVal);
                } else {
                    seatsCards[targetKey].push(cardVal);
                }
            }
        }

        function undoLastCard() {
            if (inputHistory.length === 0) return;

            const lastInput = inputHistory.pop();
            const targetKey = lastInput.target;
            const cardVal = lastInput.card;

            if (targetKey === 'DEALER') {
                dealerCards.pop();
            } else {
                let st = splitStates[targetKey];
                if (st.active) {
                    let hIdx = lastInput.handIndex >= 0 ? lastInput.handIndex : st.currentIndex;
                    if (st.hands[hIdx]) {
                        st.hands[hIdx].cards.pop();
                    }
                    st.currentIndex = hIdx;
                } else {
                    seatsCards[targetKey].pop();
                }
            }

            currentQueueIndex = lastInput.queueIdx;
            currentPlayerTurnIndex = lastInput.playerIdx;
            manualTargetOverride = null;
            updateCount(cardVal, -1);
            handResolved = false;
            document.getElementById('outcomeDisplay').innerText = "";
            updateUI();
        }

        function updateCount(card, direction = 1) {
            totalCardsSeen += (1 * direction);

            let delta = 0;
            if (['2','3','4','5','6'].includes(card)) delta = 1;
            else if (['10','J','Q','K','A'].includes(card)) delta = -1;

            runningCount += (delta * direction);
            
            const remainingDecks = Math.max(0.5, totalDecks - (totalCardsSeen / 52));
            currentTrueCount = runningCount / remainingDecks;

            let recBet = 5;
            if (currentTrueCount >= 5) recBet = 40;
            else if (currentTrueCount >= 4) recBet = 30;
            else if (currentTrueCount >= 3) recBet = 20;
            else if (currentTrueCount >= 2) recBet = 10;

            document.getElementById('tcVal').innerText = currentTrueCount.toFixed(1);
            document.getElementById('recommendedBetDisplay').innerText = `(Consigliati: ${recBet}€)`;
        }

        function calculateHandTotal(cardsArr) {
            if (!cardsArr || cardsArr.length === 0) return { total: 0, displayStr: "0", isSoft: false, busted: false, isBlackjack: false };
            
            let hardTotal = 0;
            let aceCount = 0;
            
            cardsArr.forEach(c => {
                if (c === 'A') { aceCount++; hardTotal += 1; }
                else if (['J','Q','K','10'].includes(c)) hardTotal += 10;
                else hardTotal += parseInt(c);
            });

            let softTotal = hardTotal;
            let isSoft = false;

            if (aceCount > 0 && hardTotal + 10 <= 21) {
                softTotal = hardTotal + 10;
                isSoft = true;
            }

            let finalTotal = isSoft ? softTotal : hardTotal;
            let displayStr = isSoft ? `${hardTotal}/${softTotal}` : `${finalTotal}`;

            return { 
                total: finalTotal, 
                lowTotal: hardTotal,
                highTotal: finalTotal,
                displayStr: displayStr, 
                isSoft: isSoft, 
                busted: hardTotal > 21, 
                isBlackjack: cardsArr.length === 2 && finalTotal === 21 
            };
        }

        function getBaseValue(c) {
            if (['J','Q','K','10'].includes(c)) return 10;
            if (c === 'A') return 11;
            return parseInt(c);
        }

        function calculateStrategy() {
            let uSt = splitStates[userSeatKey];
            const currentHandCards = uSt.active ? (uSt.hands[uSt.currentIndex] ? uSt.hands[uSt.currentIndex].cards : []) : seatsCards[userSeatKey];
            if (dealerCards.length === 0 || currentHandCards.length === 0) return { action: "DISTRIBUZIONE...", note: "Attendi completamento carte" };

            const info = calculateHandTotal(currentHandCards);
            const dVal = getBaseValue(dealerCards[0]);
            const tc = currentTrueCount;

            let prefix = uSt.active ? `[MANO ${uSt.hands[uSt.currentIndex].id}] ` : '';

            if (info.busted) return { action: prefix + "SBALLATO!", note: "" };
            if (info.isBlackjack) return { action: prefix + "BLACKJACK!", note: "Paga 3 a 2" };

            let insuranceNote = (dVal === 11 && tc >= 3) ? "⚠️ PRENDI ASSICURAZIONE" : "";

            if (currentHandCards.length === 2 && info.total === 16 && dVal === 10 && tc >= 0) return { action: prefix + "STAI", note: "Deviazione Hi-Lo (TC >= 0)" };
            if (currentHandCards.length === 2 && info.total === 15 && dVal === 10 && tc >= 4) return { action: prefix + "STAI", note: "Deviazione Hi-Lo (TC >= +4)" };

            if (info.total === 11 && currentHandCards.length === 2 && dVal === 11 && tc >= 1) return { action: prefix + "RADDOPPIA", note: "Deviazione Hi-Lo (TC >= +1)" };
            if (info.total === 10 && currentHandCards.length === 2 && (dVal === 10 || dVal === 11) && tc >= 4) return { action: prefix + "RADDOPPIA", note: "Deviazione Hi-Lo (TC >= +4)" };

            if (currentHandCards.length === 2 && getBaseValue(currentHandCards[0]) === getBaseValue(currentHandCards[1])) {
                const pVal = getBaseValue(currentHandCards[0]);
                if (pVal === 11 || pVal === 8) return { action: prefix + "DIVIDI", note: insuranceNote };
                if (pVal === 9) return { action: prefix + ((dVal === 7 || dVal >= 10) ? "STAI" : "DIVIDI"), note: insuranceNote };
            }

            if (info.total >= 17 && !info.isSoft) return { action: prefix + "STAI", note: insuranceNote };
            if (info.total >= 13 && info.total <= 16 && !info.isSoft) return { action: prefix + ((dVal >= 2 && dVal <= 6) ? "STAI" : "CHIEDI"), note: insuranceNote };
            if (info.total === 12 && !info.isSoft) return { action: prefix + ((dVal >= 4 && dVal <= 6) ? "STAI" : "CHIEDI"), note: insuranceNote };
            if (info.total === 11) return { action: prefix + ((currentHandCards.length === 2) ? "RADDOPPIA" : "CHIEDI"), note: insuranceNote };
            if (info.total === 10) return { action: prefix + ((currentHandCards.length === 2 && dVal <= 9) ? "RADDOPPIA" : "CHIEDI"), note: insuranceNote };

            return { action: prefix + "CHIEDI", note: insuranceNote };
        }

        function evaluateSingleHandWin(userRes, dealerRes, stake) {
            if (userRes.busted) return -stake;
            if (dealerRes.busted) return stake;
            
            if (userRes.isBlackjack) {
                return dealerRes.isBlackjack ? 0 : stake * 1.5;
            }
            if (dealerRes.isBlackjack) return -stake;

            if (userRes.total > dealerRes.total) return stake;
            if (userRes.total < dealerRes.total) return -stake;
            return 0;
        }

        function checkAutoResolve() {
            if (handResolved) return;

            if (dealerCards.length < 2) return;
            
            let uSt = splitStates[userSeatKey];
            if (uSt.active && uSt.hands.some(h => h.cards.length === 0)) return;
            if (!uSt.active && seatsCards[userSeatKey].length < 2) return;

            const dealerRes = calculateHandTotal(dealerCards);
            
            if (dealerRes.total >= 17 || dealerRes.busted) {
                let baseStake = userBet * (isDoubleActive ? 2 : 1);
                let winAmount = 0;

                if (uSt.active) {
                    uSt.hands.forEach(h => {
                        winAmount += evaluateSingleHandWin(calculateHandTotal(h.cards), dealerRes, baseStake);
                    });
                } else {
                    winAmount = evaluateSingleHandWin(calculateHandTotal(seatsCards[userSeatKey]), dealerRes, baseStake);
                }

                currentBankroll += winAmount;
                netProfit += winAmount;
                handResolved = true;

                let outcomeTxt = "";
                if (winAmount > 0) outcomeTxt = `AUTO-RISULTATO: VINCI +${winAmount}€ 🎉`;
                else if (winAmount < 0) outcomeTxt = `AUTO-RISULTATO: PERDI ${winAmount}€ ❌`;
                else outcomeTxt = "AUTO-RISULTATO: PARITÀ / PUSH 🤝 (0€)";

                const outcomeEl = document.getElementById('outcomeDisplay');
                outcomeEl.innerText = outcomeTxt;
                outcomeEl.style.color = winAmount > 0 ? "#52b788" : (winAmount < 0 ? "#e63946" : "#d4af37");

                updateFinancials();
            }
        }

        function updateFinancials() {
            document.getElementById('bankrollVal').innerText = `${currentBankroll}€`;
            const profitEl = document.getElementById('profitVal');
            profitEl.innerText = `${netProfit >= 0 ? '+' : ''}${netProfit}€`;
            profitEl.className = netProfit >= 0 ? "profit-pos" : "profit-neg";
        }

        function updateUI() {
            let currentTarget = getActiveTarget();

            const dSlot = document.getElementById('dealerSlot');
            const dInfo = calculateHandTotal(dealerCards);
            dSlot.innerHTML = dealerCards.map(c => `<span class="card-tag">${c}</span>`).join('');
            document.getElementById('dealerTitle').innerText = `Mazziere (${dInfo.displayStr})`;
            dSlot.style.borderColor = (currentTarget === 'DEALER') ? '#38b000' : '#d4af37';

            for (let i = 1; i <= 7; i++) {
                const key = `SEAT${i}`;
                const seatEl = document.getElementById(`seat${i}`);
                const cardsEl = document.getElementById(`sc${i}`);
                const scoreEl = document.getElementById(`score${i}`);
                const st = splitStates[key];

                seatEl.className = 'seat';
                if (activeSeats[key]) seatEl.classList.add('active-player');
                if (key === userSeatKey) seatEl.classList.add('user-seat');
                if (key === currentTarget) seatEl.classList.add('target-turn');

                if (st.active) {
                    let handsHTML = st.hands.map((h, idx) => {
                        let hInfo = calculateHandTotal(h.cards);
                        let isActiveSubhand = (idx === st.currentIndex && key === currentTarget);
                        return `
                            <div class="split-hand ${isActiveSubhand ? 'active-subhand' : ''}">
                                <div class="split-hand-label">${h.id}</div>
                                <div>${h.cards.map(c => `<span class="card-tag">${c}</span>`).join('')}</div>
                                <div class="split-score">(${hInfo.displayStr})</div>
                            </div>
                        `;
                    }).join('');

                    cardsEl.innerHTML = `<div class="split-container">${handsHTML}</div>`;
                    scoreEl.innerText = ""; 
                } else {
                    cardsEl.innerHTML = seatsCards[key].map(c => `<span class="card-tag">${c}</span>`).join('');
                    let handInfo = calculateHandTotal(seatsCards[key]);
                    scoreEl.innerText = seatsCards[key].length > 0 ? `(${handInfo.displayStr})` : "";
                }
            }

            let curSt = currentTarget !== 'DEALER' ? splitStates[currentTarget] : null;

            let turnText = currentTarget === 'DEALER' ? 'MAZZIERE' : (currentTarget === userSeatKey ? (splitStates[userSeatKey].active ? `IO (MANO ${splitStates[userSeatKey].hands[splitStates[userSeatKey].currentIndex].id})` : 'LA TUA MANO (IO)') : `POSTAZIONE P${currentTarget.replace('SEAT','')}${curSt && curSt.active ? ' (MANO ' + curSt.hands[curSt.currentIndex].id + ')' : ''}`);
            document.getElementById('turnTracker').innerText = handResolved ? "MANO CONCLUSA (CLICCA NUOVA MANO)" : `PROSSIMA CARTA PER: ${turnText}`;

            if (!handResolved) {
                const res = calculateStrategy();
                document.getElementById('decisionHeader').innerText = `Consiglio Per La Tua Mano`;
                document.getElementById('decisionOutput').innerText = res.action;
                document.getElementById('deviationNote').innerText = res.note;
            }
            updateChipsDisplay();
        }

        function setInitialBankroll(val) {
            let num = parseFloat(val);
            if (isNaN(num) || num <= 0) num = 500;
            initialBankroll = num;
            currentBankroll = num;
            netProfit = 0;
            updateFinancials();
        }

        function nextHand() {
            dealerCards = [];
            seatsCards = { SEAT1: [], SEAT2: [], SEAT3: [], SEAT4: [], SEAT5: [], SEAT6: [], SEAT7: [] };
            splitStates = {
                SEAT1: createInitialSplitState(),
                SEAT2: createInitialSplitState(),
                SEAT3: createInitialSplitState(),
                SEAT4: createInitialSplitState(),
                SEAT5: createInitialSplitState(),
                SEAT6: createInitialSplitState(),
                SEAT7: createInitialSplitState()
            };
            manualTargetOverride = null;
            currentQueueIndex = 0;
            currentPlayerTurnIndex = 0;
            isInitialDealComplete = false;
            handResolved = false;
            inputHistory = [];
            userBet = 0;
            isDoubleActive = false;
            document.getElementById('doubleBadge').style.display = 'none';
            document.getElementById('btnDouble').classList.remove('active');
            document.getElementById('btnSplit').classList.remove('active');
            document.getElementById('outcomeDisplay').innerText = "";
            buildDistributionQueue();
            updateUI();
        }

        function resetAll() {
            if (confirm("Reset completo del mazzo, del True Count e dei dati del tavolo?")) {
                runningCount = 0;
                totalCardsSeen = 0;
                currentTrueCount = 0;
                currentBankroll = initialBankroll;
                netProfit = 0;
                document.getElementById('tcVal').innerText = "0.0";
                updateFinancials();
                nextHand();
            }
        }

        buildDistributionQueue();
        updateUI();
        updateFinancials();
    </script>
</body>
