<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackjack Pro - Kelly Bankroll Engine</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1d13; color: #ffffff; padding: 6px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        h1 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #d4af37; margin-bottom: 4px; text-align: center; }

        /* Sfondo Tavolo Verde */
        .felt-table { 
            width: 100%; 
            max-width: 500px; 
            background: radial-gradient(circle, #2d6a4f 0%, #1b4332 70%, #081c15 100%); 
            border: 3px solid #d4af37; 
            border-radius: 15px 15px 160px 160px; 
            padding: 10px 4px 22px 4px; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 6px 15px rgba(0,0,0,0.6); 
            margin-bottom: 6px; 
        }

        /* Area Dealer */
        .dealer-area { text-align: center; margin-bottom: 6px; }
        .dealer-card-slot { display: inline-flex; justify-content: center; gap: 3px; min-width: 60px; min-height: 36px; background: rgba(0,0,0,0.4); border: 2px dashed #d4af37; border-radius: 6px; padding: 2px; align-items: center; cursor: pointer; }

        /* Postazioni invertite (P1 Destra -> P7 Sinistra) */
        .seats-container { display: flex; flex-direction: row-reverse; justify-content: space-between; margin-top: 10px; align-items: flex-end; padding: 0 2px; }
        .seat { 
            width: 62px; 
            background: rgba(0,0,0,0.45); 
            border: 1px solid rgba(212,175,55,0.4); 
            border-radius: 8px; 
            padding: 3px 1px; 
            text-align: center; 
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .seat.active { border: 2px solid #38b000; background: rgba(56,176,0,0.2); }
        .seat.user-seat { border: 2px solid #d4af37; background: rgba(212,175,55,0.3); box-shadow: 0 0 8px rgba(212,175,55,0.6); }
        .seat-title { font-size: 0.55rem; color: #d4af37; font-weight: bold; margin-bottom: 2px; text-transform: uppercase; white-space: nowrap; }
        .seat-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; min-height: 26px; }

        .card-tag { background: #ffffff; color: #000; font-weight: 900; padding: 1px 3px; border-radius: 3px; font-size: 0.8rem; border: 1px solid #000; line-height: 1.1; }

        /* Configurazione Bankroll Iniziale */
        .bankroll-config { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 500px; background: rgba(0,0,0,0.7); border: 1px solid #d4af37; border-radius: 6px; padding: 4px 8px; margin-bottom: 6px; font-size: 0.72rem; }
        .bankroll-input { width: 70px; background: #222; border: 1px solid #d4af37; color: #fff; font-weight: bold; padding: 2px 4px; border-radius: 4px; text-align: center; }

        /* Output Decisione */
        .decision-box { width: 100%; max-width: 500px; background: #000000; border: 2px solid #d4af37; border-radius: 10px; padding: 6px; text-align: center; margin-bottom: 6px; }
        .decision-title { font-size: 0.6rem; text-transform: uppercase; color: #aaa; }
        .decision-text { font-size: 1.3rem; font-weight: 900; color: #74c69d; }
        .deviation-note { font-size: 0.68rem; color: #d4af37; font-weight: bold; }
        .outcome-text { font-size: 1.1rem; font-weight: 900; margin-top: 2px; }

        /* Dashboard Kelly Stats */
        .stats-row { display: flex; justify-content: space-between; width: 100%; max-width: 500px; font-size: 0.7rem; background: rgba(0,0,0,0.6); padding: 5px 8px; border-radius: 6px; margin-bottom: 6px; }
        .stat-val { color: #d4af37; font-weight: bold; }
        .profit-pos { color: #52b788; font-weight: bold; }
        .profit-neg { color: #e63946; font-weight: bold; }

        /* Tastierino */
        .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; max-width: 500px; margin-bottom: 6px; }
        .key-btn { background: #343a40; border: 1px solid #6c757d; color: white; font-size: 1.1rem; font-weight: 900; padding: 9px 0; border-radius: 6px; cursor: pointer; text-align: center; }
        .key-btn:active { background: #d4af37; color: black; }
        .key-btn.asso { background: #d4af37; color: black; }

        /* Bottoni */
        .actions-row { display: flex; gap: 6px; width: 100%; max-width: 500px; margin-top: auto; }
        .act-btn { flex: 1; padding: 10px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; }
        .btn-reset { background: #e63946; color: white; }
        .btn-next { background: #457b9d; color: white; }
        .btn-resolve { background: #2a9d8f; color: white; }
    </style>
</head>
<body>

    <h1>Blackjack Pro - Kelly Engine</h1>

    <!-- Configurazione Capitale Iniziale -->
    <div class="bankroll-config">
        <span>Capitale Iniziale (€):</span>
        <input type="number" id="initBankrollInput" class="bankroll-input" value="500" step="50" onchange="setInitialBankroll(this.value)">
        <span>Unit Base (1%): <strong id="unitBaseVal" style="color: #d4af37;">5€</strong></span>
    </div>

    <!-- Tavolo Verde -->
    <div class="felt-table">
        <!-- Dealer -->
        <div class="dealer-area">
            <div class="seat-title" id="dealerTitle">Mazziere (0)</div>
            <div id="dealerSlot" class="dealer-card-slot" onclick="selectTarget('DEALER')"></div>
        </div>

        <!-- 7 Postazioni -->
        <div class="seats-container">
            <div id="seat1" class="seat" onclick="selectTarget('SEAT1')">
                <div class="seat-title" id="st1">P1</div>
                <div class="seat-cards" id="sc1"></div>
            </div>
            <div id="seat2" class="seat" onclick="selectTarget('SEAT2')">
                <div class="seat-title" id="st2">P2</div>
                <div class="seat-cards" id="sc2"></div>
            </div>
            <div id="seat3" class="seat" onclick="selectTarget('SEAT3')">
                <div class="seat-title" id="st3">P3</div>
                <div class="seat-cards" id="sc3"></div>
            </div>
            <div id="seat4" class="seat user-seat" onclick="selectTarget('SEAT4')">
                <div class="seat-title" id="st4">IO (P4)</div>
                <div class="seat-cards" id="sc4"></div>
            </div>
            <div id="seat5" class="seat" onclick="selectTarget('SEAT5')">
                <div class="seat-title" id="st5">P5</div>
                <div class="seat-cards" id="sc5"></div>
            </div>
            <div id="seat6" class="seat" onclick="selectTarget('SEAT6')">
                <div class="seat-title" id="st6">P6</div>
                <div class="seat-cards" id="sc6"></div>
            </div>
            <div id="seat7" class="seat" onclick="selectTarget('SEAT7')">
                <div class="seat-title" id="st7">P7</div>
                <div class="seat-cards" id="sc7"></div>
            </div>
        </div>
    </div>

    <!-- Decision Box -->
    <div class="decision-box">
        <div class="decision-title">Consiglio / Esito Mano</div>
        <div id="decisionOutput" class="decision-text">INSERISCI CARTE</div>
        <div id="deviationNote" class="deviation-note"></div>
        <div id="outcomeDisplay" class="outcome-text"></div>
    </div>

    <!-- Financials & Stats -->
    <div class="stats-row">
        <div>TC: <span id="tcVal" class="stat-val">0.0</span></div>
        <div>Puntata Kelly: <span id="betVal" class="stat-val">5€ (1 U)</span></div>
        <div>Profitto: <span id="profitVal" class="profit-pos">0€</span></div>
        <div>Bankroll: <span id="bankrollVal" class="stat-val">500€</span></div>
    </div>

    <!-- Tastierino -->
    <div class="keypad">
        <button class="key-btn" onclick="inputCard('2')">2</button>
        <button class="key-btn" onclick="inputCard('3')">3</button>
        <button class="key-btn" onclick="inputCard('4')">4</button>
        <button class="key-btn" onclick="inputCard('5')">5</button>
        <button class="key-btn" onclick="inputCard('6')">6</button>
        <button class="key-btn" onclick="inputCard('7')">7</button>
        <button class="key-btn" onclick="inputCard('8')">8</button>
        <button class="key-btn" onclick="inputCard('9')">9</button>
        <button class="key-btn" onclick="inputCard('10')">10</button>
        <button class="key-btn asso" onclick="inputCard('A')">A</button>
    </div>

    <!-- Azioni -->
    <div class="actions-row">
        <button class="act-btn btn-resolve" onclick="resolveHand()">Calcola Risultato</button>
        <button class="act-btn btn-next" onclick="nextHand()">Nuova Mano</button>
        <button class="act-btn btn-reset" onclick="resetAll()">Reset Mazzo</button>
    </div>

    <script>
        let dealerCards = [];
        let seats = { SEAT1: [], SEAT2: [], SEAT3: [], SEAT4: [], SEAT5: [], SEAT6: [], SEAT7: [] };
        let userSeatKey = 'SEAT4';
        let activeTargetKey = 'DEALER';
        
        let runningCount = 0;
        let totalCardsSeen = 0;
        const totalDecks = 6;
        let currentTrueCount = 0;

        // Gestione Kelly Bankroll
        let initialBankroll = 500;
        let currentBankroll = 500;
        let unitSize = 5;
        let netProfit = 0;
        let currentBet = 5;
        let currentUnits = 1;
        let handResolved = false;
        let lastActionRecommended = "CHIEDI";

        function setInitialBankroll(val) {
            let num = parseFloat(val);
            if (isNaN(num) || num <= 0) num = 500;
            initialBankroll = num;
            currentBankroll = num;
            netProfit = 0;
            recalculateKellyUnit();
            updateFinancials();
        }

        function recalculateKellyUnit() {
            // L'unità base è l'1% del bankroll residuo (minimo 1€)
            unitSize = Math.max(1, Math.floor(currentBankroll / 100));
            document.getElementById('unitBaseVal').innerText = `${unitSize}€`;
        }

        function selectTarget(key) {
            if (key.startsWith('SEAT') && activeTargetKey === key && userSeatKey !== key) {
                userSeatKey = key;
            }
            activeTargetKey = key;
            updateUI();
        }

        function inputCard(val) {
            updateCount(val);

            if (activeTargetKey === 'DEALER') {
                dealerCards.push(val);
            } else {
                seats[activeTargetKey].push(val);
            }
            updateUI();
        }

        function updateCount(card) {
            totalCardsSeen++;
            if (['2','3','4','5','6'].includes(card)) runningCount++;
            else if (['10','J','Q','K','A'].includes(card)) runningCount--;
            
            const remainingDecks = Math.max(0.5, totalDecks - (totalCardsSeen / 52));
            currentTrueCount = runningCount / remainingDecks;
            
            // Rampa di Puntata Kelly basata sul TC
            if (currentTrueCount <= 1) currentUnits = 1;
            else if (currentTrueCount < 3) currentUnits = 2;
            else if (currentTrueCount < 4) currentUnits = 4;
            else if (currentTrueCount < 5) currentUnits = 6;
            else currentUnits = 8; // Max Bet Ramp per TC >= +5

            currentBet = currentUnits * unitSize;

            document.getElementById('tcVal').innerText = currentTrueCount.toFixed(1);
            document.getElementById('betVal').innerText = `${currentBet}€ (${currentUnits} U)`;
        }

        function calculateHandTotal(cardsArr) {
            let total = 0;
            let aceCount = 0;
            cardsArr.forEach(c => {
                if (c === 'A') { aceCount++; total += 11; }
                else if (['J','Q','K','10'].includes(c)) total += 10;
                else total += parseInt(c);
            });

            while (total > 21 && aceCount > 0) {
                total -= 10;
                aceCount--;
            }

            return { total, isSoft: aceCount > 0, busted: total > 21, isBlackjack: cardsArr.length === 2 && total === 21 };
        }

        function getBaseValue(c) {
            if (['J','Q','K','10'].includes(c)) return 10;
            if (c === 'A') return 11;
            return parseInt(c);
        }

        function calculateStrategy() {
            const userCards = seats[userSeatKey];
            if (dealerCards.length === 0 || userCards.length < 2) return { action: "INSERISCI CARTE", note: "Imposta Dealer e tua mano" };

            const info = calculateHandTotal(userCards);
            const dVal = getBaseValue(dealerCards[0]);
            const tc = currentTrueCount;

            if (info.busted) return { action: "SBALLATO!", note: "" };
            if (info.isBlackjack) return { action: "BLACKJACK!", note: "Paga 3 a 2" };

            let insuranceNote = (dVal === 11 && tc >= 3) ? "⚠️ PRENDI ASSICURAZIONE" : "";

            // Deviazioni Illustrious 18
            if (userCards.length === 2 && info.total === 16 && dVal === 10 && tc >= 0) return { action: "STAI", note: "Deviazione Hi-Lo (TC >= 0)" };
            if (userCards.length === 2 && info.total === 15 && dVal === 10 && tc >= 4) return { action: "STAI", note: "Deviazione Hi-Lo (TC >= +4)" };
            if (userCards.length === 2 && info.total === 12 && dVal === 2 && tc >= 3) return { action: "STAI", note: "Deviazione Hi-Lo (TC >= +3)" };
            if (userCards.length === 2 && info.total === 12 && dVal === 3 && tc >= 2) return { action: "STAI", note: "Deviazione Hi-Lo (TC >= +2)" };

            // Deviazioni Raddoppio
            if (info.total === 11 && userCards.length === 2 && dVal === 11 && tc >= 1) return { action: "RADDOPPIA", note: "Deviazione Hi-Lo (TC >= +1)" };
            if (info.total === 10 && userCards.length === 2 && (dVal === 10 || dVal === 11) && tc >= 4) return { action: "RADDOPPIA", note: "Deviazione Hi-Lo (TC >= +4)" };

            // Strategia Base
            if (userCards.length === 2 && getBaseValue(userCards[0]) === getBaseValue(userCards[1])) {
                const pVal = getBaseValue(userCards[0]);
                if (pVal === 11 || pVal === 8) return { action: "DIVIDI", note: insuranceNote };
                if (pVal === 9) return { action: (dVal === 7 || dVal >= 10) ? "STAI" : "DIVIDI", note: insuranceNote };
            }

            if (info.total >= 17 && !info.isSoft) return { action: "STAI", note: insuranceNote };
            if (info.total >= 13 && info.total <= 16 && !info.isSoft) return { action: (dVal >= 2 && dVal <= 6) ? "STAI" : "CHIEDI", note: insuranceNote };
            if (info.total === 12 && !info.isSoft) return { action: (dVal >= 4 && dVal <= 6) ? "STAI" : "CHIEDI", note: insuranceNote };
            if (info.total === 11) return { action: (userCards.length === 2) ? "RADDOPPIA" : "CHIEDI", note: insuranceNote };
            if (info.total === 10) return { action: (userCards.length === 2 && dVal <= 9) ? "RADDOPPIA" : "CHIEDI", note: insuranceNote };

            return { action: "CHIEDI", note: insuranceNote };
        }

        function resolveHand() {
            if (handResolved) return;

            const userCards = seats[userSeatKey];
            if (dealerCards.length === 0 || userCards.length < 2) {
                alert("Inserisci prima le carte per te e per il mazziere!");
                return;
            }

            const userRes = calculateHandTotal(userCards);
            const dealerRes = calculateHandTotal(dealerCards);
            let outcomeTxt = "";
            let winAmount = 0;

            let betMultiplier = (lastActionRecommended === "RADDOPPIA") ? 2 : 1;
            let actualBet = currentBet * betMultiplier;

            if (userRes.busted) {
                outcomeTxt = `HAI PERSO ❌ (-${actualBet}€)`;
                winAmount = -actualBet;
            } else if (userRes.isBlackjack) {
                if (dealerRes.isBlackjack) {
                    outcomeTxt = "PARITÀ / PUSH 🤝 (0€)";
                    winAmount = 0;
                } else {
                    let bjPayout = actualBet * 1.5;
                    outcomeTxt = `BLACKJACK! 🎉 (+${bjPayout}€)`;
                    winAmount = bjPayout;
                }
            } else if (dealerRes.busted) {
                outcomeTxt = `IL MAZZIERE SBALLA! VINCI 🎉 (+${actualBet}€)`;
                winAmount = actualBet;
            } else if (userRes.total > dealerRes.total) {
                outcomeTxt = `HAI VINTO! 🎉 (+${actualBet}€)`;
                winAmount = actualBet;
            } else if (userRes.total < dealerRes.total) {
                outcomeTxt = `HAI PERSO ❌ (-${actualBet}€)`;
                winAmount = -actualBet;
            } else {
                outcomeTxt = "PARITÀ / PUSH 🤝 (0€)";
                winAmount = 0;
            }

            currentBankroll += winAmount;
            netProfit += winAmount;
            handResolved = true;

            const outcomeEl = document.getElementById('outcomeDisplay');
            outcomeEl.innerText = outcomeTxt;
            outcomeEl.style.color = winAmount > 0 ? "#52b788" : (winAmount < 0 ? "#e63946" : "#d4af37");

            recalculateKellyUnit();
            updateFinancials();
        }

        function updateFinancials() {
            document.getElementById('bankrollVal').innerText = `${currentBankroll}€`;
            const profitEl = document.getElementById('profitVal');
            profitEl.innerText = `${netProfit >= 0 ? '+' : ''}${netProfit}€`;
            profitEl.className = netProfit >= 0 ? "profit-pos" : "profit-neg";
        }

        function updateUI() {
            const dSlot = document.getElementById('dealerSlot');
            const dInfo = calculateHandTotal(dealerCards);
            dSlot.innerHTML = dealerCards.map(c => `<span class="card-tag">${c}</span>`).join('');
            document.getElementById('dealerTitle').innerText = `Mazziere (${dInfo.total})`;

            for (let i = 1; i <= 7; i++) {
                const key = `SEAT${i}`;
                const seatEl = document.getElementById(`seat${i}`);
                const titleEl = document.getElementById(`st${i}`);
                const cardsEl = document.getElementById(`sc${i}`);

                seatEl.className = 'seat';
                if (key === activeTargetKey) seatEl.classList.add('active');
                if (key === userSeatKey) seatEl.classList.add('user-seat');

                titleEl.innerText = (key === userSeatKey) ? `IO (P${i})` : `P${i}`;
                cardsEl.innerHTML = seats[key].map(c => `<span class="card-tag">${c}</span>`).join('');
            }

            if (!handResolved) {
                const res = calculateStrategy();
                lastActionRecommended = res.action;
                document.getElementById('decisionOutput').innerText = res.action;
                document.getElementById('deviationNote').innerText = res.note;
            }
        }

        function nextHand() {
            dealerCards = [];
            seats = { SEAT1: [], SEAT2: [], SEAT3: [], SEAT4: [], SEAT5: [], SEAT6: [], SEAT7: [] };
            activeTargetKey = 'DEALER';
            handResolved = false;
            document.getElementById('outcomeDisplay').innerText = "";
            updateUI();
        }

        function resetAll() {
            if (confirm("Reset completo del mazzo e dei conteggi?")) {
                runningCount = 0;
                totalCardsSeen = 0;
                currentTrueCount = 0;
                currentBankroll = initialBankroll;
                netProfit = 0;
                recalculateKellyUnit();
                updateFinancials();
                nextHand();
            }
        }

        updateUI();
        recalculateKellyUnit();
        updateFinancials();
    </script>
</body>
</html>
