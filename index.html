<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blackjack Pro - Automatic Dealing & Auto Resolve</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b1d13; color: #ffffff; padding: 6px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        h1 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #d4af37; margin-bottom: 4px; text-align: center; }

        /* Sfondo Tavolo Verde */
        .felt-table { 
            width: 100%; 
            max-width: 500px; 
            background: radial-gradient(circle, #2d6a4f 0%, #1b4332 70%, #081c15 100%); 
            border: 3px solid #d4af37; 
            border-radius: 15px 15px 140px 140px; 
            padding: 8px 4px 14px 4px; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 6px 15px rgba(0,0,0,0.6); 
            margin-bottom: 6px; 
        }

        /* Area Dealer */
        .dealer-area { text-align: center; margin-bottom: 6px; }
        .dealer-card-slot { display: inline-flex; justify-content: center; gap: 3px; min-width: 60px; min-height: 36px; background: rgba(0,0,0,0.4); border: 2px dashed #d4af37; border-radius: 6px; padding: 2px; align-items: center; cursor: pointer; }

        /* Postazioni Tavolo (7 a 1) */
        .seats-container { display: flex; flex-direction: row-reverse; justify-content: space-between; margin-top: 6px; align-items: flex-end; padding: 0 2px; }
        .seat { 
            width: 62px; 
            background: rgba(0,0,0,0.45); 
            border: 1px solid rgba(212,175,55,0.3); 
            border-radius: 6px; 
            padding: 3px 1px; 
            text-align: center; 
            cursor: pointer;
            transition: all 0.2s ease;
            opacity: 0.5;
        }
        .seat.active-player { opacity: 1; border-color: #d4af37; }
        .seat.target-turn { border: 2px solid #38b000 !important; background: rgba(56,176,0,0.35) !important; opacity: 1; transform: scale(1.05); }
        .seat.user-seat { border: 2px solid #d4af37; background: rgba(212,175,55,0.25); opacity: 1; }
        .seat-title { font-size: 0.52rem; color: #d4af37; font-weight: bold; margin-bottom: 2px; text-transform: uppercase; white-space: nowrap; }
        .seat-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; min-height: 26px; }

        .card-tag { background: #ffffff; color: #000; font-weight: 900; padding: 1px 3px; border-radius: 3px; font-size: 0.78rem; border: 1px solid #000; line-height: 1.1; }

        /* Indicatore Turno Corrente */
        .turn-tracker { width: 100%; max-width: 500px; background: #111; border: 1px solid #38b000; color: #38b000; font-weight: bold; font-size: 0.75rem; text-align: center; padding: 4px; border-radius: 6px; margin-bottom: 6px; text-transform: uppercase; }

        /* Top Config Bankroll */
        .top-config { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 500px; background: rgba(0,0,0,0.7); border: 1px solid #d4af37; border-radius: 6px; padding: 4px 8px; margin-bottom: 6px; font-size: 0.72rem; }
        .bankroll-input { width: 65px; background: #222; border: 1px solid #d4af37; color: #fff; font-weight: bold; padding: 2px 4px; border-radius: 4px; text-align: center; }

        /* Controlli Raddoppio e Split */
        .special-actions-row { display: flex; justify-content: space-around; width: 100%; max-width: 500px; background: rgba(0,0,0,0.8); border: 1px solid #d4af37; border-radius: 6px; padding: 4px; margin-bottom: 6px; gap: 6px; }
        .opt-btn { flex: 1; padding: 5px; font-size: 0.7rem; font-weight: bold; border-radius: 4px; border: 1px solid #777; background: #222; color: #fff; cursor: pointer; text-transform: uppercase; }
        .opt-btn.active { background: #d4af37; color: #000; border-color: #fff; font-weight: 900; }

        /* Output Decisione */
        .decision-box { width: 100%; max-width: 500px; background: #000000; border: 2px solid #d4af37; border-radius: 8px; padding: 5px; text-align: center; margin-bottom: 6px; }
        .decision-title { font-size: 0.6rem; text-transform: uppercase; color: #aaa; }
        .decision-text { font-size: 1.15rem; font-weight: 900; color: #74c69d; }
        .deviation-note { font-size: 0.65rem; color: #d4af37; font-weight: bold; }
        .outcome-text { font-size: 1rem; font-weight: 900; margin-top: 2px; }

        /* Area Chip Betting System */
        .chips-section { width: 100%; max-width: 500px; background: rgba(0,0,0,0.8); border: 1px solid #d4af37; border-radius: 8px; padding: 5px; margin-bottom: 6px; text-align: center; }
        .chips-title { font-size: 0.65rem; color: #aaa; text-transform: uppercase; margin-bottom: 3px; }
        .chips-row { display: flex; justify-content: space-around; align-items: center; gap: 4px; }
        
        .chip {
            width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 0.8rem; color: white; border: 3px dashed #ffffff; box-shadow: 0 3px 6px rgba(0,0,0,0.6);
            cursor: pointer; user-select: none; transition: transform 0.1s;
        }
        .chip:active { transform: scale(0.9); }
        .chip-5 { background: radial-gradient(circle, #e63946, #9e2a2b); }
        .chip-10 { background: radial-gradient(circle, #1d3557, #457b9d); }
        .chip-25 { background: radial-gradient(circle, #2a9d8f, #116a5d); }
        .chip-50 { background: radial-gradient(circle, #e07a5f, #a03c28); }
        .chip-100 { background: radial-gradient(circle, #2b2b2b, #000000); border-color: #d4af37; color: #d4af37; }
        .chip-reset { background: #333; border: 1px solid #777; width: 34px; height: 34px; font-size: 0.65rem; color: #fff; border-radius: 50%; cursor: pointer; }

        /* Stats Row */
        .stats-row { display: flex; justify-content: space-between; width: 100%; max-width: 500px; font-size: 0.7rem; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 6px; margin-bottom: 6px; }
        .stat-val { color: #d4af37; font-weight: bold; }
        .profit-pos { color: #52b788; font-weight: bold; }
        .profit-neg { color: #e63946; font-weight: bold; }

        /* Tastierino */
        .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; width: 100%; max-width: 500px; margin-bottom: 6px; }
        .key-btn { background: #343a40; border: 1px solid #6c757d; color: white; font-size: 1.1rem; font-weight: 900; padding: 8px 0; border-radius: 6px; cursor: pointer; text-align: center; }
        .key-btn:active { background: #d4af37; color: black; }
        .key-btn.asso { background: #d4af37; color: black; }

        /* Bottoni Azioni */
        .actions-row { display: flex; gap: 4px; width: 100%; max-width: 500px; margin-top: auto; }
        .act-btn { flex: 1; padding: 9px 2px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; font-size: 0.72rem; text-transform: uppercase; }
        .btn-undo { background: #f77f00; color: white; }
        .btn-next { background: #457b9d; color: white; }
        .btn-reset { background: #e63946; color: white; }
    </style>
</head>
<body>

    <h1>Blackjack Pro - Auto Dealing</h1>

    <!-- Configurazione Top -->
    <div class="top-config">
        <div><span>Punta con Fiches e clicca i numeri</span></div>
        <div>
            <span>Bankroll:</span>
            <input type="number" id="initBankrollInput" class="bankroll-input" value="500" step="50" onchange="setInitialBankroll(this.value)">€
        </div>
    </div>

    <!-- Tavolo Verde -->
    <div class="felt-table">
        <!-- Dealer -->
        <div class="dealer-area">
            <div class="seat-title" id="dealerTitle">Mazziere (0)</div>
            <div id="dealerSlot" class="dealer-card-slot" onclick="selectTargetManual('DEALER')"></div>
        </div>

        <!-- 7 Postazioni (Da P7 a P1) -->
        <div class="seats-container">
            <div id="seat7" class="seat" onclick="toggleSeatActive('SEAT7')">
                <div class="seat-title" id="st7">P7</div>
                <div class="seat-cards" id="sc7"></div>
            </div>
            <div id="seat6" class="seat" onclick="toggleSeatActive('SEAT6')">
                <div class="seat-title" id="st6">P6</div>
                <div class="seat-cards" id="sc6"></div>
            </div>
            <div id="seat5" class="seat" onclick="toggleSeatActive('SEAT5')">
                <div class="seat-title" id="st5">P5</div>
                <div class="seat-cards" id="sc5"></div>
            </div>
            <div id="seat4" class="seat user-seat active-player" onclick="toggleSeatActive('SEAT4')">
                <div class="seat-title" id="st4">IO (P4)</div>
                <div class="seat-cards" id="sc4"></div>
            </div>
            <div id="seat3" class="seat" onclick="toggleSeatActive('SEAT3')">
                <div class="seat-title" id="st3">P3</div>
                <div class="seat-cards" id="sc3"></div>
            </div>
            <div id="seat2" class="seat" onclick="toggleSeatActive('SEAT2')">
                <div class="seat-title" id="st2">P2</div>
                <div class="seat-cards" id="sc2"></div>
            </div>
            <div id="seat1" class="seat" onclick="toggleSeatActive('SEAT1')">
                <div class="seat-title" id="st1">P1</div>
                <div class="seat-cards" id="sc1"></div>
            </div>
        </div>
    </div>

    <!-- Indicatore Turno Automatico -->
    <div id="turnTracker" class="turn-tracker">PROSSIMA CARTA PER: P4</div>

    <!-- Opzioni Speciali: Raddoppio & Split -->
    <div class="special-actions-row">
        <button id="btnSplit" class="opt-btn" onclick="toggleSplit()">✂️ Split Mano</button>
        <button id="btnDouble" class="opt-btn" onclick="toggleDouble()">2x Raddoppio</button>
    </div>

    <!-- System Chip Puntata -->
    <div class="chips-section">
        <div class="chips-title">Puntata Base: <strong id="currentBetDisplay" style="color:#74c69d; font-size:0.85rem;">0€</strong> <span id="recommendedBetDisplay" style="color:#d4af37; font-size:0.68rem; margin-left:6px;">(Consigliati: 5€)</span></div>
        <div class="chips-row">
            <div class="chip chip-5" onclick="addChip(5)">5</div>
            <div class="chip chip-10" onclick="addChip(10)">10</div>
            <div class="chip chip-25" onclick="addChip(25)">25</div>
            <div class="chip chip-50" onclick="addChip(50)">50</div>
            <div class="chip chip-100" onclick="addChip(100)">100</div>
            <button class="chip-reset" onclick="resetChips()">CLR</button>
        </div>
    </div>

    <!-- Decision Box -->
    <div class="decision-box">
        <div class="decision-title" id="decisionHeader">Consiglio Per La Tua Mano</div>
        <div id="decisionOutput" class="decision-text">INSERISCI CARTE</div>
        <div id="deviationNote" class="deviation-note"></div>
        <div id="outcomeDisplay" class="outcome-text"></div>
    </div>

    <!-- Financials & Stats -->
    <div class="stats-row">
        <div>TC: <span id="tcVal" class="stat-val">0.0</span></div>
        <div>Profitto: <span id="profitVal" class="profit-pos">0€</span></div>
        <div>Bankroll: <span id="bankrollVal" class="stat-val">500€</span></div>
    </div>

    <!-- Tastierino -->
    <div class="keypad">
        <button class="key-btn" onclick="inputCard('2')">2</button>
        <button class="key-btn" onclick="inputCard('3')">3</button>
        <button class="key-btn" onclick="inputCard('4')">4</button>
        <button class="key-btn" onclick="inputCard('5')">5</button>
        <button class="key-btn" onclick="inputCard('6')">6</button>
        <button class="key-btn" onclick="inputCard('7')">7</button>
        <button class="key-btn" onclick="inputCard('8')">8</button>
        <button class="key-btn" onclick="inputCard('9')">9</button>
        <button class="key-btn" onclick="inputCard('10')">10</button>
        <button class="key-btn asso" onclick="inputCard('A')">A</button>
    </div>

    <!-- Azioni -->
    <div class="actions-row">
        <button class="act-btn btn-undo" onclick="undoLastCard()">↩ Annulla Carta</button>
        <button class="act-btn btn-next" onclick="nextHand()">Nuova Mano</button>
        <button class="act-btn btn-reset" onclick="resetAll()">Reset Mazzo</button>
    </div>

    <script>
        let dealerCards = [];
        let seatsCards = { SEAT1: [], SEAT2: [], SEAT3: [], SEAT4: [], SEAT5: [], SEAT6: [], SEAT7: [] };
        let activeSeats = { SEAT1: false, SEAT2: false, SEAT3: false, SEAT4: true, SEAT5: false, SEAT6: false, SEAT7: false };
        let userSeatKey = 'SEAT4';

        let targetQueue = [];
        let currentQueueIndex = 0;
        let manualTargetOverride = null;

        let isSplitActive = false;
        let isDoubleActive = false;
        let inputHistory = [];

        // Conteggio mazzo
        let runningCount = 0;
        let totalCardsSeen = 0;
        const totalDecks = 6;
        let currentTrueCount = 0;

        // Gestione Chip & Bankroll
        let initialBankroll = 500;
        let currentBankroll = 500;
        let netProfit = 0;
        let userBet = 0; 
        let handResolved = false;

        function addChip(amount) {
            userBet += amount;
            updateChipsDisplay();
        }

        function resetChips() {
            userBet = 0;
            updateChipsDisplay();
        }

        function updateChipsDisplay() {
            let totalRisk = userBet * (isDoubleActive ? 2 : 1) * (isSplitActive ? 2 : 1);
            document.getElementById('currentBetDisplay').innerText = `${userBet}€ ${totalRisk !== userBet ? '(Totale: ' + totalRisk + '€)' : ''}`;
        }

        function toggleSeatActive(seatKey) {
            if (seatKey === userSeatKey) return; // IO è sempre attivo
            activeSeats[seatKey] = !activeSeats[seatKey];
            buildDistributionQueue();
            updateUI();
        }

        function toggleSplit() {
            isSplitActive = !isSplitActive;
            document.getElementById('btnSplit').classList.toggle('active', isSplitActive);
            updateChipsDisplay();
            updateUI();
        }

        function toggleDouble() {
            isDoubleActive = !isDoubleActive;
            document.getElementById('btnDouble').classList.toggle('active', isDoubleActive);
            updateChipsDisplay();
        }

        // Costruisce la sequenza di distribuzione: 1° giro (P7->P1->Dealer) + 2° giro (P7->P1)
        function buildDistributionQueue() {
            targetQueue = [];
            let order = ['SEAT7', 'SEAT6', 'SEAT5', 'SEAT4', 'SEAT3', 'SEAT2', 'SEAT1'];
            
            // 1° Giro carte giocatori
            order.forEach(s => { if (activeSeats[s]) targetQueue.push(s); });
            // 1ª Carta Dealer
            targetQueue.push('DEALER');
            // 2° Giro carte giocatori
            order.forEach(s => { if (activeSeats[s]) targetQueue.push(s); });
        }

        function getActiveTarget() {
            if (manualTargetOverride) return manualTargetOverride;
            if (currentQueueIndex < targetQueue.length) {
                return targetQueue[currentQueueIndex];
            }
            // Dopo la distribuzione iniziale, il focus predefinito per ulteriori carte è il Mazziere o la tua mano
            return 'DEALER';
        }

        function selectTargetManual(key) {
            manualTargetOverride = key;
            updateUI();
        }

        function inputCard(val) {
            let target = getActiveTarget();
            addCardToTarget(target, val);
            inputHistory.push({ target: target, card: val, queueIdx: currentQueueIndex });

            if (!manualTargetOverride && currentQueueIndex < targetQueue.length) {
                currentQueueIndex++;
            }

            // Calcolo automatico mazziere quando raggiunge 17+
            checkAutoResolve();
            updateUI();
        }

        function addCardToTarget(targetKey, cardVal) {
            updateCount(cardVal, 1);
            if (targetKey === 'DEALER') {
                dealerCards.push(cardVal);
            } else {
                seatsCards[targetKey].push(cardVal);
            }
        }

        function undoLastCard() {
            if (inputHistory.length === 0) return;

            const lastInput = inputHistory.pop();
            const targetKey = lastInput.target;
            const cardVal = lastInput.card;

            if (targetKey === 'DEALER') {
                dealerCards.pop();
            } else {
                seatsCards[targetKey].pop();
            }

            currentQueueIndex = lastInput.queueIdx;
            manualTargetOverride = null;
            updateCount(cardVal, -1);
            handResolved = false;
            document.getElementById('outcomeDisplay').innerText = "";
            updateUI();
        }

        function updateCount(card, direction = 1) {
            totalCardsSeen += (1 * direction);

            let delta = 0;
            if (['2','3','4','5','6'].includes(card)) delta = 1;
            else if (['10','J','Q','K','A'].includes(card)) delta = -1;

            runningCount += (delta * direction);
            
            const remainingDecks = Math.max(0.5, totalDecks - (totalCardsSeen / 52));
            currentTrueCount = runningCount / remainingDecks;

            let recBet = 5;
            if (currentTrueCount >= 5) recBet = 40;
            else if (currentTrueCount >= 4) recBet = 30;
            else if (currentTrueCount >= 3) recBet = 20;
            else if (currentTrueCount >= 2) recBet = 10;

            document.getElementById('tcVal').innerText = currentTrueCount.toFixed(1);
            document.getElementById('recommendedBetDisplay').innerText = `(Consigliati: ${recBet}€)`;
        }

        function calculateHandTotal(cardsArr) {
            let total = 0;
            let aceCount = 0;
            cardsArr.forEach(c => {
                if (c === 'A') { aceCount++; total += 11; }
                else if (['J','Q','K','10'].includes(c)) total += 10;
                else total += parseInt(c);
            });

            while (total > 21 && aceCount > 0) {
                total -= 10;
                aceCount--;
            }

            return { total, isSoft: aceCount > 0, busted: total > 21, isBlackjack: cardsArr.length === 2 && total === 21 };
        }

        function getBaseValue(c) {
            if (['J','Q','K','10'].includes(c)) return 10;
            if (c === 'A') return 11;
            return parseInt(c);
        }

        function calculateStrategy() {
            const userCards = seatsCards[userSeatKey];
            if (dealerCards.length === 0 || userCards.length < 2) return { action: "DISTRIBUZIONE...", note: "Attendi completamento carte" };

            const info = calculateHandTotal(userCards);
            const dVal = getBaseValue(dealerCards[0]);
            const tc = currentTrueCount;

            if (info.busted) return { action: "SBALLATO!", note: "" };
            if (info.isBlackjack) return { action: "BLACKJACK!", note: "Paga 3 a 2" };

            let insuranceNote = (dVal === 11 && tc >= 3) ? "⚠️ PRENDI ASSICURAZIONE" : "";

            // Deviazioni Illustrious 18
            if (userCards.length === 2 && info.total === 16 && dVal === 10 && tc >= 0) return { action: "STAI", note: "Deviazione Hi-Lo (TC >= 0)" };
            if (userCards.length === 2 && info.total === 15 && dVal === 10 && tc >= 4) return { action: "STAI", note: "Deviazione Hi-Lo (TC >= +4)" };

            // Deviazioni Raddoppio
            if (info.total === 11 && userCards.length === 2 && dVal === 11 && tc >= 1) return { action: "RADDOPPIA", note: "Deviazione Hi-Lo (TC >= +1)" };
            if (info.total === 10 && userCards.length === 2 && (dVal === 10 || dVal === 11) && tc >= 4) return { action: "RADDOPPIA", note: "Deviazione Hi-Lo (TC >= +4)" };

            // Strategia Base
            if (userCards.length === 2 && getBaseValue(userCards[0]) === getBaseValue(userCards[1])) {
                const pVal = getBaseValue(userCards[0]);
                if (pVal === 11 || pVal === 8) return { action: "DIVIDI", note: insuranceNote };
                if (pVal === 9) return { action: (dVal === 7 || dVal >= 10) ? "STAI" : "DIVIDI", note: insuranceNote };
            }

            if (info.total >= 17 && !info.isSoft) return { action: "STAI", note: insuranceNote };
            if (info.total >= 13 && info.total <= 16 && !info.isSoft) return { action: (dVal >= 2 && dVal <= 6) ? "STAI" : "CHIEDI", note: insuranceNote };
            if (info.total === 12 && !info.isSoft) return { action: (dVal >= 4 && dVal <= 6) ? "STAI" : "CHIEDI", note: insuranceNote };
            if (info.total === 11) return { action: (userCards.length === 2) ? "RADDOPPIA" : "CHIEDI", note: insuranceNote };
            if (info.total === 10) return { action: (userCards.length === 2 && dVal <= 9) ? "RADDOPPIA" : "CHIEDI", note: insuranceNote };

            return { action: "CHIEDI", note: insuranceNote };
        }

        // Calcolo Automatico della Mano Quando il Mazziere Arriva a 17+ o Sballa
        function checkAutoResolve() {
            if (handResolved) return;

            const userCards = seatsCards[userSeatKey];
            if (dealerCards.length < 2 || userCards.length < 2) return;

            const dealerRes = calculateHandTotal(dealerCards);
            
            // Il mazziere deve chiamare fino a 16 e stare da 17 in su (o sballare)
            if (dealerRes.total >= 17 || dealerRes.busted) {
                let singleBet = userBet * (isDoubleActive ? 2 : 1);
                const userRes = calculateHandTotal(userCards);

                let winAmount = 0;
                if (userRes.busted) {
                    winAmount = -singleBet;
                } else if (userRes.isBlackjack) {
                    winAmount = dealerRes.isBlackjack ? 0 : singleBet * 1.5;
                } else if (dealerRes.busted || userRes.total > dealerRes.total) {
                    winAmount = singleBet;
                } else if (userRes.total < dealerRes.total) {
                    winAmount = -singleBet;
                } else {
                    winAmount = 0;
                }

                if (isSplitActive) winAmount *= 2; // Raddoppia la posta se in Split

                currentBankroll += winAmount;
                netProfit += winAmount;
                handResolved = true;

                let outcomeTxt = "";
                if (winAmount > 0) outcomeTxt = `AUTO-RISULTATO: VINCI +${winAmount}€ 🎉`;
                else if (winAmount < 0) outcomeTxt = `AUTO-RISULTATO: PERDI ${winAmount}€ ❌`;
                else outcomeTxt = "AUTO-RISULTATO: PARITÀ / PUSH 🤝 (0€)";

                const outcomeEl = document.getElementById('outcomeDisplay');
                outcomeEl.innerText = outcomeTxt;
                outcomeEl.style.color = winAmount > 0 ? "#52b788" : (winAmount < 0 ? "#e63946" : "#d4af37");

                updateFinancials();
            }
        }

        function updateFinancials() {
            document.getElementById('bankrollVal').innerText = `${currentBankroll}€`;
            const profitEl = document.getElementById('profitVal');
            profitEl.innerText = `${netProfit >= 0 ? '+' : ''}${netProfit}€`;
            profitEl.className = netProfit >= 0 ? "profit-pos" : "profit-neg";
        }

        function updateUI() {
            let currentTarget = getActiveTarget();

            // Aggiorna Mazziere
            const dSlot = document.getElementById('dealerSlot');
            const dInfo = calculateHandTotal(dealerCards);
            dSlot.innerHTML = dealerCards.map(c => `<span class="card-tag">${c}</span>`).join('');
            document.getElementById('dealerTitle').innerText = `Mazziere (${dInfo.total})`;
            dSlot.style.borderColor = (currentTarget === 'DEALER') ? '#38b000' : '#d4af37';

            // Aggiorna Postazioni 1..7
            for (let i = 1; i <= 7; i++) {
                const key = `SEAT${i}`;
                const seatEl = document.getElementById(`seat${i}`);
                const cardsEl = document.getElementById(`sc${i}`);

                seatEl.className = 'seat';
                if (activeSeats[key]) seatEl.classList.add('active-player');
                if (key === userSeatKey) seatEl.classList.add('user-seat');
                if (key === currentTarget) seatEl.classList.add('target-turn');

                cardsEl.innerHTML = seatsCards[key].map(c => `<span class="card-tag">${c}</span>`).join('');
            }

            // Testo indicatore del turno
            let turnText = currentTarget === 'DEALER' ? 'MAZZIERE' : (currentTarget === userSeatKey ? 'LA TUA MANO (IO)' : `POSTAZIONE P${currentTarget.replace('SEAT','')}`);
            document.getElementById('turnTracker').innerText = handResolved ? "MANO CONCLUSA (CLICCA NUOVA MANO)" : `PROSSIMA CARTA PER: ${turnText}`;

            if (!handResolved) {
                const res = calculateStrategy();
                document.getElementById('decisionHeader').innerText = `Consiglio Per La Tua Mano`;
                document.getElementById('decisionOutput').innerText = res.action;
                document.getElementById('deviationNote').innerText = res.note;
            }
            updateChipsDisplay();
        }

        function setInitialBankroll(val) {
            let num = parseFloat(val);
            if (isNaN(num) || num <= 0) num = 500;
            initialBankroll = num;
            currentBankroll = num;
            netProfit = 0;
            updateFinancials();
        }

        function nextHand() {
            dealerCards = [];
            seatsCards = { SEAT1: [], SEAT2: [], SEAT3: [], SEAT4: [], SEAT5: [], SEAT6: [], SEAT7: [] };
            manualTargetOverride = null;
            currentQueueIndex = 0;
            handResolved = false;
            inputHistory = [];
            userBet = 0;
            isDoubleActive = false;
            isSplitActive = false;
            document.getElementById('btnDouble').classList.remove('active');
            document.getElementById('btnSplit').classList.remove('active');
            document.getElementById('outcomeDisplay').innerText = "";
            buildDistributionQueue();
            updateUI();
        }

        function resetAll() {
            if (confirm("Reset completo del mazzo e dei conteggi?")) {
                runningCount = 0;
                totalCardsSeen = 0;
                currentTrueCount = 0;
                currentBankroll = initialBankroll;
                netProfit = 0;
                updateFinancials();
                nextHand();
            }
        }

        buildDistributionQueue();
        updateUI();
        updateFinancials();
    </script>
</body>
</html>
